version: '3.9'

services:
  ex-auth:
    container_name: ex-auth
    build:
      context: ./app
      dockerfile: ../docker/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app
    environment:
      AUTH_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      ex-db-main:
        condition: service_healthy
    networks:
      - server-net

  ex-db-main:
    image: postgres:15-alpine
    container_name: ex-db-main
    restart: unless-stopped
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - server-net
    ports:
      - '7002:5432'
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

networks:
  server-net:
    driver: bridge
